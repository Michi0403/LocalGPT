name: Logging Integrity

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  logging-guard:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prevent logging removal disguised as cleanup
        shell: pwsh
        run: ./build/Assert-LoggingIntegrity.ps1
