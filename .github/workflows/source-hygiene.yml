name: Source Hygiene

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  source-guards:
    name: Source and compiler syntax guards
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.301

      - name: Check protected governance files
        shell: pwsh
        run: ./build/Assert-ProtectedRepositoryFiles.ps1

      - name: Check source formatting
        shell: pwsh
        run: ./build/Assert-SourceFormatting.ps1 -MaxLineLength 600

      - name: Parse maintained C# with Roslyn
        shell: pwsh
        run: ./build/Assert-CSharpSyntax.ps1

      - name: Check component safety contracts
        shell: pwsh
        run: ./build/Assert-ComponentSafety.ps1

      - name: Check workflow contracts
        shell: pwsh
        run: ./build/Assert-WorkflowContracts.ps1

      - name: Check human collaboration contracts
        shell: pwsh
        run: ./build/Assert-HumanCollaboration.ps1

      - name: Check database-first architecture tasks
        shell: pwsh
        run: ./build/Assert-ArchitectureTasks.ps1

      - name: Check security policy
        shell: pwsh
        run: ./build/Assert-SecurityPolicy.ps1
