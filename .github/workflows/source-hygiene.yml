name: Source Hygiene

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  formatting-guard:
    name: Physical line formatting
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check source formatting
        shell: pwsh
        run: ./build/Assert-SourceFormatting.ps1 -MaxLineLength 600

      - name: Check security policy
        shell: pwsh
        run: ./build/Assert-SecurityPolicy.ps1
