name: Publish LocalGPT Kawaii documentation

on:
  push:
    paths:
      - '.github/workflows/publish-shipped-docs.yml'
      - '.github/scripts/prepare-pages-artifact.py'
      - '.github/pages/localgpt-kawaii-docs.zip'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: localgpt-github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Validate and package Kawaii documentation
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    permissions:
      contents: read
      pages: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out publishing snapshot
        uses: actions/checkout@v6

      - name: Prepare pinned Kawaii documentation
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/pages/localgpt-kawaii-docs.zip
          python3 .github/scripts/prepare-pages-artifact.py \
            --archive .github/pages/localgpt-kawaii-docs.zip \
            --output pages-artifact

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Kawaii documentation artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-artifact

      - name: Summarize artifact
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## LocalGPT Kawaii documentation'
            echo
            echo 'The workflow publishes the tracked, validated documentation snapshot.'
            echo
            echo '```json'
            cat pages-artifact/github-pages-deployment.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy GitHub Pages
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Kawaii documentation
        id: deployment
        uses: actions/deploy-pages@v4
