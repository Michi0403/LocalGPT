name: Publish LocalGPT Kawaii documentation

on:
  push:
    paths:
      - '.github/workflows/publish-shipped-docs.yml'
      - 'build/Assert-PagesArtifact.ps1'
      - '.github/pages/localgpt-kawaii-docs.zip'
      - 'src/LocalGPT/LocalGPT.csproj'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: localgpt-github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Validate and package Kawaii documentation
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    permissions:
      contents: read
      pages: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out publishing snapshot
        uses: actions/checkout@v6

      - name: Prepare pinned Kawaii documentation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = [xml](Get-Content -LiteralPath 'src/LocalGPT/LocalGPT.csproj' -Raw)
          $version = [string](($project.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version)
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'LocalGPT project version not found.' }
          & ./build/Assert-PagesArtifact.ps1 -Archive '.github/pages/localgpt-kawaii-docs.zip' -Output 'pages-artifact' -ExpectedVersion $version
          if (-not (Test-Path 'pages-artifact/index.html')) { throw 'Missing prepared documentation.' }
          if (-not (Test-Path 'pages-artifact/api/index.html')) { throw 'Missing API reference.' }
          if (-not (Test-Path 'pages-artifact/documentation-status.json')) { throw 'Missing documentation status.' }

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Kawaii documentation artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-artifact

      - name: Summarize artifact
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## LocalGPT Kawaii documentation'
            echo
            echo 'The workflow publishes the tracked, version-matched, validated documentation snapshot.'
            echo
            echo '```json'
            cat pages-artifact/github-pages-deployment.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy GitHub Pages
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Kawaii documentation
        id: deployment
        uses: actions/deploy-pages@v4
